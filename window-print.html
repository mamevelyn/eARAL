<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-ARAL Hub · 100-item Window Card Print</title><style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:#e9f2fb;color:#153d6c;margin:0;padding:16px}.sheet{width:min(100%,900px);background:#fff;margin:0 auto 16px;padding:22px 25px;border-radius:12px;box-shadow:0 3px 14px #1232}h1{margin:0 0 7px;font-size:23px}h2{margin:0 0 10px;font-size:17px}.info{font-size:13px;color:#536c80}.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0}.toolbar button,.toolbar select{border:1px solid #b8cede;background:#eaf4ff;color:#0c4680;padding:10px 14px;border-radius:8px;cursor:pointer}.toolbar button{background:#135a9c;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.item{min-height:68px;border:1px solid #b9cbd8;padding:7px;border-radius:5px;break-inside:avoid}.n{display:block;font-size:10px;color:#536d82}.q{font-size:15px;text-align:center;font-weight:bold;margin:6px 0}.line{height:15px;border-bottom:1px solid #9ab}.key{display:none}.key.show{display:block}.keygrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:12px;gap:7px}.keygrid span{border-bottom:1px solid #aab;padding:4px}@page{size:A4 portrait;margin:11mm}@media print{body{padding:0;background:white}.sheet{padding:0;box-shadow:none;border-radius:0;width:100%;margin:0}.sheet.page{break-after:page}.toolbar{display:none}.item{min-height:61px;padding:5px}.q{font-size:13px}.key{break-before:page}.key:not(.show){display:none!important}}@media(max-width:610px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="sheet page"><h1>e-ARAL Hub · <span id="title"></span></h1><p class="info">Linasin Elementary School · 100 items per operation · 5-minute challenge</p><div class="toolbar"><label>Operation <select id="op"><option value="add">Addition</option><option value="sub">Subtraction</option><option value="mul">Multiplication</option><option value="div">Division</option></select></label><button id="new">Bagong set</button><button id="print">I-print</button><label><input type="checkbox" id="keyToggle"> Isama ang answer key</label></div><p>Pangalan / Code: _______________________ &nbsp; Petsa: ______________</p><h2>Items 1–50</h2><div class="grid" id="one"></div></div><div class="sheet page"><h2>Items 51–100</h2><div class="grid" id="two"></div></div><div class="sheet key" id="key"><h2>Answer Key · <span id="keyTitle"></span></h2><div class="keygrid" id="keys"></div></div>
<script src="window-data.js"></script><script>
let meta=window.EARAL_WINDOW,p=new URLSearchParams(location.search),level=p.get('level')==='2'?2:1,op=meta.OPERATIONS[p.get('op')]?p.get('op'):'add';document.getElementById('op').value=op;
let items;
function fromLast(){try{let list=JSON.parse(localStorage.getItem(`e-aral-v15-window-last:${level}:${op}`));return Array.isArray(list)&&list.length===100?list:null}catch{return null}}
function refresh(generate=false){items=(!generate?fromLast():null)||meta.generate(level,op);const ttl=`${meta.settings[level].title} — ${meta.OPERATIONS[op].label}`;document.getElementById('title').textContent=ttl;document.getElementById('keyTitle').textContent=ttl;
const format=(a,offset)=>a.map((q,i)=>`<div class="item"><span class="n">${i+1+offset}</span><div class="q">${q.text}</div><div class="line"></div></div>`).join('');document.getElementById('one').innerHTML=format(items.slice(0,50),0);document.getElementById('two').innerHTML=format(items.slice(50),50);document.getElementById('keys').innerHTML=items.map((x,i)=>`<span>${i+1}. ${x.answer}</span>`).join('');try{localStorage.setItem(`e-aral-v15-window-last:${level}:${op}`,JSON.stringify(items))}catch{}}
document.getElementById('op').onchange=e=>{op=e.target.value;refresh()};document.getElementById('new').onclick=()=>refresh(true);document.getElementById('print').onclick=()=>window.print();document.getElementById('keyToggle').onchange=e=>document.getElementById('key').classList.toggle('show',e.target.checked);refresh();
</script></body></html>
