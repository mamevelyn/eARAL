<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print • e-ARAL Hub</title><link rel="icon" type="image/png" href="linasin-es-logo.png"><link rel="stylesheet" href="style.css"><style>body{background:white}.printwrap{max-width:920px;margin:auto;padding:25px}.pitem{page-break-inside:avoid;border-bottom:1px solid #d5e2ea;padding:12px 0}.pitem .choice{font-size:14px;padding:4px;margin:3px 0;border:none}.pitem h3{margin:6px 0} .pstory{border:1px solid #d6e4ee;background:#f5f8f9;border-radius:10px;padding:12px;line-height:1.65;margin:12px 0}.pagehead{border-bottom:3px solid #168786;padding-bottom:13px}.print-picture{width:180px;height:160px;object-fit:contain;display:block;margin:8px 0}.print-options-images{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.print-option-picture{width:110px;height:90px;object-fit:contain;vertical-align:middle}.print-actions{padding:14px 0}@media print{.print-actions{display:none}.printwrap{padding:0}.pitem{break-inside:avoid}.pstory{break-inside:avoid}}</style></head><body><main class="printwrap"><div class="pagehead"><h1><img src="linasin-es-logo.png" alt="Linasin Elementary School logo" style="width:44px;height:44px;vertical-align:middle;margin-right:10px">e-ARAL Hub · Printable Worksheet</h1><div id="subtitle"></div><p>Learner name / code: __________________________________　 Date: ________________</p></div><div class="print-actions"><button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button><a class="btn secondary" href="javascript:window.close()">Close</a></div><div id="sheet"></div><p class="mini">Maaaring gamitin ang worksheet sa bahay o sa klase. I-review ang mga sagot kasama ang guro o magulang.</p></main><script src="lessons.js"></script><script src="bank.js"></script><script>
const params=new URLSearchParams(location.search),g=Number(params.get('grade')||4),t=params.get('track')||'reading-fil',type=params.get('type')||'assessment', lang=params.get('lang')||'en';const esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let qs=[];let lesson;
if(type==='lesson'){lesson=window.BASA_DATA.lessons.find(x=>x.grade===g&&x.track===t&&x.id===params.get('id'));qs=lesson?.questions||[]}else{qs=t==='math'?(window.BASA_BANK[`${g}:${t}`]?.questions||[]):[...(window.BASA_DATA.checks[`${g}:${t}`]||[]),...(window.BASA_BANK[`${g}:${t}`]?.questions||[])];}
if(type==='assessment'&&qs.length>20){qs=qs.sort(()=>Math.random()-.5).slice(0,20)}
document.getElementById('subtitle').textContent=`${g?'Grade '+g:'Kindergarten'} · ${t.replace('reading-fil','Filipino Reading').replace('reading-eng','English Reading').replace('math','Math')} · ${type==='lesson'?lesson?.title||'Lesson':'Skill Check'}`;
const target=document.getElementById('sheet');let last='';target.innerHTML=(lesson?`<div class="pstory">${esc(lesson.passage)}</div>`:'')+qs.map((q,i)=>{let p='';if(type==='assessment'&&q.stimulus&&q.stimulus!==last){p=`<div class="pstory"><strong>Basahin ang talata:</strong><p>${esc(q.stimulus)}</p></div>`;}last=q.stimulus||'';const choices=q.options.map((v,i)=>({v,i}));for(let j=choices.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[choices[j],choices[k]]=[choices[k],choices[j]]}let picture=q.image?`<img src="${esc(q.image)}" alt="Larawan" class="print-picture">`:'';let pics=Array.isArray(q.optionImages);return p+`<div class="pitem"><h3>${i+1}. ${esc(q.q_fil&&t==='math'&&lang==='fil'?q.q_fil:q.q)}</h3>${picture}<div class="${pics?'print-options-images':''}">${choices.map((o,j)=>`<div class="choice">☐ ${String.fromCharCode(65+j)}. ${pics?`<img src="${esc(q.optionImages[o.i])}" alt="Larawan ${String.fromCharCode(65+j)}" class="print-option-picture">`:esc(o.v)}</div>`).join('')}</div></div>`}).join('');
</script></body></html>
